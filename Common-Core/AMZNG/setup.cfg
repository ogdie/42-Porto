[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,*.egg-info,.venv,venv,mlx

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True
exclude = (build|dist|tests|mlx)/

[mypy-mlx.*]
ignore_errors = True
